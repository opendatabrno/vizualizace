name: Sestavení dat a nasazení webu

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "40 6 * * 2"          # každé úterý (datové sady se aktualizují v pondělí)
  workflow_dispatch:
  repository_dispatch:
    types: [data-aktualizovana]   # může vyvolat datový repozitář po sloučení nových dat

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Příprava dat z datových sad
        run: |
          pip install -r requirements.txt
          python scripts/build_data.py

      - name: Sestavení webu
        run: |
          mkdir _site
          cp -r index.html cizinci podklady _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Nasazení na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
